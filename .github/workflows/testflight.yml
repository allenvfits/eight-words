name: Upload to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 30
    environment: testflight
    env:
      APP_BUNDLE_ID: com.allenvfits.eightwords
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      - name: Require release credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_KEY_BASE64 \
            CERTIFICATE_BASE64 \
            CERTIFICATE_PASSWORD \
            PROFILE_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required TestFlight environment secret: $name"
              exit 1
            fi
          done

      - name: Install signing identity and provisioning profile
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/eight-words-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/eight-words.mobileprovision"
          profile_plist="$RUNNER_TEMP/eight-words-profile.plist"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_bundle_id="${profile_bundle_id#*.}"

          if [[ "$profile_bundle_id" != "$APP_BUNDLE_ID" ]]; then
            echo "The provisioning profile is for $profile_bundle_id, not $APP_BUNDLE_ID."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive signed iPhone and iPad app
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/EightWords.xcarchive"
          xcodebuild \
            -project EightWords.xcodeproj \
            -scheme EightWords \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      - name: Export App Store package
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "destination": "export",
              "method": "app-store-connect",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["APP_BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              },
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          with open(os.environ["RUNNER_TEMP"] + "/ExportOptions.plist", "wb") as output:
              plistlib.dump(options, output)
          PY

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/EightWords.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$export_options"

      - name: Validate and upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find "$RUNNER_TEMP/TestFlightExport" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          xcrun altool --validate-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          if [[ -n "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
