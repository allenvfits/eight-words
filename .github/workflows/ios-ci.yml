name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate app metadata files
        run: |
          set -euo pipefail
          plutil -lint EightWords/Info.plist EightWords/PrivacyInfo.xcprivacy
          python3 -m json.tool EightWords/EightWords.storekit > /dev/null
          python3 - <<'PY'
          import json
          import pathlib
          import plistlib

          catalog = json.loads(pathlib.Path("EightWords/Data/WordCatalog.json").read_text())
          assert set(catalog) == {"beginner", "intermediate", "advanced"}
          assert all(len(catalog[level]) == 1000 for level in catalog)
          words = [word for level in catalog.values() for word in level]
          assert len({word["id"] for word in words}) == 3000
          assert all(word["word"] and word["definition"] for word in words)

          storekit = json.loads(pathlib.Path("EightWords/EightWords.storekit").read_text())
          product = storekit["subscriptionGroups"][0]["subscriptions"][0]
          assert product["productID"] == "com.allenvfits.eightwords.plus.monthly"
          assert product["displayPrice"] == "1.99"
          assert product["recurringSubscriptionPeriod"] == "P1M"

          with pathlib.Path("EightWords/PrivacyInfo.xcprivacy").open("rb") as handle:
              privacy = plistlib.load(handle)
          assert privacy["NSPrivacyTracking"] is False
          assert privacy["NSPrivacyCollectedDataTypes"] == []

          for required in (
              "docs/privacy/index.html",
              "docs/support/index.html",
              "docs/terms/index.html",
              "docs/attributions/index.html",
              "THIRD-PARTY-NOTICES.md",
          ):
              assert pathlib.Path(required).is_file(), required
          PY
      - name: Validate opaque App Store icon
        run: |
          set -euo pipefail
          icon="EightWords/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          test "$(sips -g hasAlpha "$icon" | awk '/hasAlpha/ {print $2}')" = "no"
          test "$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')" = "1024"
      - name: Reject privileged backend credentials
        run: |
          if rg -n '(sb_secret_|service_role|SUPABASE_SERVICE_ROLE)' EightWords EightWords.xcodeproj; then
            echo "Privileged Supabase credentials must never ship in the app."
            exit 1
          fi
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project EightWords.xcodeproj
          -scheme EightWords
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          clean build
      - name: Build unsigned Release for iPhone and iPad
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/EightWordsReleaseDerivedData"

          xcodebuild \
            -project EightWords.xcodeproj \
            -scheme EightWords \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          app="$derived/Build/Products/Release-iphoneos/EightWords.app"
          test -x "$app/EightWords"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/WordCatalog.json"
          plutil -lint "$app/Info.plist" "$app/PrivacyInfo.xcprivacy"
          test "$(plutil -extract CFBundlePackageType raw -o - "$app/Info.plist")" = "APPL"
      - name: Run unit tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$simulator_id"
          xcodebuild test \
            -project EightWords.xcodeproj \
            -scheme EightWords \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO

  validate-web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/data/words.js
