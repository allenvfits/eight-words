name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate privacy manifest and app plist
        run: plutil -lint EightWords/Info.plist EightWords/PrivacyInfo.xcprivacy
      - name: Validate opaque App Store icon
        run: test "$(sips -g hasAlpha EightWords/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/hasAlpha/ {print $2}')" = "no"
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project EightWords.xcodeproj
          -scheme EightWords
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          clean build
      - name: Run unit tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$simulator_id"
          xcodebuild test \
            -project EightWords.xcodeproj \
            -scheme EightWords \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO

  validate-web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: node --check web/app.js
